<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOG</title>

    <link rel="stylesheet" href="./styles/default.css">
    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/style.css">

</head>

<body>

    <header>
        <a href="">
            <img class="header-logo" src="./assets/img/travelblog_logo.png"
                alt="Firmenlogo Travelblog mit Flugzeug und Weltkugel">
        </a>
        <nav>
            <a href="">Highlights</a>
            <a href="">FAQ</a>
            <a href="">Contact</a>
        </nav>

    </header>

    <div class="content">

        <section class="landing-section-hero">
            <img class="hero-curve-img" src="./assets/img/hero-curve.svg" alt="">
            <img class="hero-background-img" src="./assets/img/hero-picture.jpg" alt="...">
            <div class="hero-headline">
                <h1>Cappdadocia</h1>
                <p>From sunrise balloons to hidden cave dwellings, every moment feels unreal in the best way.</p>
            </div>

        </section>

    </div>



    <footer>

        <div class="footer-links">
            <div class="footer-links-copyright">
                <img src="./assets/icons/copyright.svg" alt="Copyright Symbol für Website Rechte">
                <p>Travel Blog 2026</p>
            </div>

            <a href="imprint.html">Imprint</a>
            <p> Cookie Preferences</p>
        </div>


        <div class="footer-social-media-links">

            <a href="https://www.tiktok.com/de-DE/" target="_blank">
                <img src="./assets/icons/footer_tiktok.png" alt="Ein Bild vom Tiktok Firmenlogo">
            </a>

            <a href="https://www.youtube.com/" target="_blank">
                <img src="./assets/icons/footer_youtube.png" alt="Ein Bild vom Youtube Firmenlogo">
            </a>

            <a href="https://www.facebook.com/" target="_blank">
                <img src="./assets/icons/footer_facebook.png" alt="Ein Bild vom Youtube Firmenlogo">
            </a>

            <a href="https://www.instagram.com/" target="_blank">
                <img src="./assets/icons/footer_instagram.png" alt="Ein Bild vom Instagram Firmenlogo">
            </a>

        </div>


    </footer>

</html>
